<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="flow-line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1" />
    </linearGradient>

    <radialGradient id="glow-1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-3" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35" />
      <circle cx="40" cy="40" r="1" fill="#475569" fill-opacity="0.5" />
    </pattern>

    <!-- Card Glow Filter -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.8; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 1; }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pingNode {
      0% { r: 4px; opacity: 1; }
      50% { r: 9px; opacity: 0.3; }
      100% { r: 4px; opacity: 1; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes shimmerBar {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }

    .orb-anim-1 { animation: pulseOrb 12s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-anim-2 { animation: pulseOrb 15s ease-in-out infinite alternate; transform-origin: 1000px 300px; }
    .flow-dash { stroke-dasharray: 8 8; animation: dashMove 14s linear infinite; }
    .flow-dash-fast { stroke-dasharray: 6 6; animation: dashMove 8s linear infinite; }
    .ping-circle-1 { animation: pingNode 2.4s ease-in-out infinite; }
    .ping-circle-2 { animation: pingNode 2.8s ease-in-out infinite 0.7s; }
    .ping-circle-3 { animation: pingNode 3.2s ease-in-out infinite 1.4s; }
    .pill-float-1 { animation: floatPill 5s ease-in-out infinite; }
    .pill-float-2 { animation: floatPill 6s ease-in-out infinite 1s; }
    .pill-float-3 { animation: floatPill 5.5s ease-in-out infinite 2s; }
    .pill-float-4 { animation: floatPill 6.5s ease-in-out infinite 0.5s; }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="400" rx="16" fill="url(#bg-grad)" />

  <!-- Background Animated Glow Orbs -->
  <g>
    <circle cx="200" cy="120" r="320" fill="url(#glow-1)" class="orb-anim-1" />
    <circle cx="1020" cy="280" r="340" fill="url(#glow-2)" class="orb-anim-2" />
    <circle cx="620" cy="200" r="280" fill="url(#glow-3)" />
  </g>

  <!-- Technical Grid Overlay -->
  <rect width="1200" height="400" rx="16" fill="url(#grid)" />

  <!-- Dynamic Automation & Journey Circuit Lines (Background) -->
  <g opacity="0.65">
    <!-- Top data circuit -->
    <path d="M 60 70 L 320 70 L 400 110 L 800 110 L 880 70 L 1140 70" 
          fill="none" stroke="url(#flow-line-grad)" stroke-width="1.5" class="flow-dash" />
    <!-- Bottom cross-channel bus -->
    <path d="M 80 340 L 360 340 L 440 300 L 760 300 L 840 340 L 1120 340" 
          fill="none" stroke="url(#flow-line-grad)" stroke-width="1.5" class="flow-dash-fast" />
    <!-- Center connecting wave -->
    <path d="M 120 220 C 300 160, 420 280, 600 210 C 780 140, 920 260, 1080 200" 
          fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4" />

    <!-- Dynamic Flow Nodes -->
    <g transform="translate(320, 70)">
      <circle cx="0" cy="0" r="4" fill="#38bdf8" class="ping-circle-1" />
      <circle cx="0" cy="0" r="2" fill="#ffffff" />
    </g>
    <g transform="translate(800, 110)">
      <circle cx="0" cy="0" r="4" fill="#a855f7" class="ping-circle-2" />
      <circle cx="0" cy="0" r="2" fill="#ffffff" />
    </g>
    <g transform="translate(440, 300)">
      <circle cx="0" cy="0" r="4" fill="#ec4899" class="ping-circle-3" />
      <circle cx="0" cy="0" r="2" fill="#ffffff" />
    </g>
    <g transform="translate(760, 300)">
      <circle cx="0" cy="0" r="4" fill="#38bdf8" class="ping-circle-1" />
      <circle cx="0" cy="0" r="2" fill="#ffffff" />
    </g>
  </g>

  <!-- Border Accent Outline -->
  <rect x="1" y="1" width="1198" height="398" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- ================= FOREGROUND (Protected Hierarchy) ================= -->

  <!-- Top Category Tag -->
  <g transform="translate(600, 72)" text-anchor="middle">
    <rect x="-145" y="-16" width="290" height="32" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1" />
    <circle cx="-120" cy="0" r="4" fill="#10b981" />
    <text x="-105" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="12" font-weight="700" fill="#93c5fd" letter-spacing="1.5">ENTERPRISE MARTECH DIRECTORY</text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(600, 150)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="44" font-weight="900" fill="url(#primary-grad)" letter-spacing="-0.5" filter="url(#soft-glow)">
      AWESOME ENTERPRISE MARKETING AUTOMATION
    </text>
    <!-- Crisp Foreground Title Overlay for Uncompromised Legibility -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      AWESOME ENTERPRISE MARKETING AUTOMATION
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 205)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="18" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Curated Ecosystem of SaaS Giants, Open-Source CDPs &amp; Cross-Channel Orchestration
    </text>
    <text y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="14" font-weight="500" fill="#cbd5e1" letter-spacing="0.4">
      Campaign Journeys • Real-Time Identity Resolution • Data Sovereignty • AI Personalization
    </text>
  </g>

  <!-- Interactive / Floating Modern Feature Badges -->
  <g transform="translate(600, 310)" text-anchor="middle">
    <!-- Pill 1: CDP -->
    <g transform="translate(-390, 0)" class="pill-float-1">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e1b4b" fill-opacity="0.9" stroke="#6366f1" stroke-width="1.2" />
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="13" font-weight="600" fill="#c7d2fe">⚡ Unified CDPs</text>
    </g>

    <!-- Pill 2: Orchestration -->
    <g transform="translate(-130, 0)" class="pill-float-2">
      <rect x="-105" y="-18" width="210" height="36" rx="18" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="13" font-weight="600" fill="#bae6fd">🎯 Omnichannel Journeys</text>
    </g>

    <!-- Pill 3: Open-Source -->
    <g transform="translate(135, 0)" class="pill-float-3">
      <rect x="-100" y="-18" width="200" height="36" rx="18" fill="#2e1065" fill-opacity="0.9" stroke="#a855f7" stroke-width="1.2" />
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="13" font-weight="600" fill="#f3e8ff">🔓 Open-Source &amp; Free</text>
    </g>

    <!-- Pill 4: AI & Agentic -->
    <g transform="translate(385, 0)" class="pill-float-4">
      <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#4c0519" fill-opacity="0.9" stroke="#ec4899" stroke-width="1.2" />
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="13" font-weight="600" fill="#fce7f3">🤖 Agentic AI Growth</text>
    </g>
  </g>

  <!-- Top Right Mini Status -->
  <g transform="translate(1120, 36)" text-anchor="end">
    <rect x="-110" y="-12" width="110" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="-96" cy="0" r="3.5" fill="#22c55e" />
    <text x="-16" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="11" font-weight="600" fill="#cbd5e1">2026 EDITION</text>
  </g>
</svg>
